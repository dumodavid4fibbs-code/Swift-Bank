<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | SwiftBank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Asset/css/index.css">
</head>
<body class="dashboard-body">

  <div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="index.html" class="logo sidebar-logo">Swift<span>Bank</span></a>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <span class="sidebar-icon">&#127968;</span> Dashboard
        </a>

        </a>
        <a href="transaction-history.html" class="sidebar-link">
          <span class="sidebar-icon">&#128220;</span> Transaction History
        </a>
        <a href="statements.html" class="sidebar-link">
          <span class="sidebar-icon">&#128203;</span> Statements
        </a>
        <a href="settings.html" class="sidebar-link active">
          <span class="sidebar-icon">&#9881;&#65039;</span> Settings
        </a>
      </nav>
      <a href="login.html" class="sidebar-logout">&#8592; Log Out</a>
    </aside>

    <!-- Main -->
    <main class="dashboard-main">

      <!-- Top bar -->
      <div class="dashboard-topbar">
        <h1>Settings</h1>
        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Notifications">&#128276;<span class="notif-dot"></span></button>
          <a href="profile.html" class="avatar">D</a>
        </div>
      </div>

      <div class="settings-stack">

        <!-- Profile Information -->
        <section class="panel">
          <h2>Profile Information</h2>
          <form class="settings-form" id="profile-form">
            <div class="form-row">
              <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" value="David">
              </div>
              <div class="form-group">
                <label for="settings-email">Email</label>
                <input type="email" id="settings-email" value="dave4@email.com">
              </div>
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" value="(234) 811-891-5622">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <p class="settings-confirm"></p>
          </form>
        </section>

        <!-- Security -->
        <section class="panel">
          <h2>Security</h2>
          <form class="settings-form" id="password-form">
            <div class="form-group">
              <label for="current-password">Current Password</label>
              <input type="password" id="current-password" placeholder="Enter current password">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" placeholder="At least 8 characters" minlength="8">
              </div>
              <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" placeholder="Re-enter new password">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
            <p class="settings-confirm"></p>
          </form>
        </section>

        <!-- Notifications -->
        <section class="panel">
          <h2>Notifications</h2>
          <form class="settings-form" id="notifications-form">
            <label class="toggle">
                <input type="checkbox" checked>
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Email me for every transaction</span>
            </label>
            <label class="toggle">
              <input type="checkbox" checked>
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Text me security alerts (OTP, new logins)</span>
            </label>
            <label class="toggle">
              <input type="checkbox">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Send me a weekly spending summary</span>
            </label>
            <label class="toggle">
              <input type="checkbox">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Send me product news and offers</span>
            </label>
            <button type="submit" class="btn btn-primary">Save Preferences</button>
            <p class="settings-confirm"></p>
          </form>
        </section>

      </div>

    </main>
  </div>

  <script src="Asset/java/script.js"></script>
</body>
</html>
