<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SwiftBank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Asset/css/index.css">
</head>
<body class="auth-body">

  <header class="auth-header">
    <a href="index.html" class="logo">Swift<span>Bank</span></a>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <p class="auth-badge">&#128274; Bank-grade encryption</p>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Takes about five minutes.</p>

      <form class="auth-form" id="signup-form">
        <div class="form-row">
          <div class="form-group">
            <label for="surname">Surname</label>
            <input type="text" id="surname" placeholder="Austin" required>
          </div>
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" placeholder="David" required>
          </div>
        </div>

        <div class="form-group">
          <label for="other-names">Other Names</label>
          <input type="text" id="other-names" placeholder="Optional">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="sex">Sex</label>
            <select id="sex" required>
              <option value="" disabled selected>Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </div>
          <div class="form-group">
            <label for="marital-status">Marital Status</label>
            <select id="marital-status" required>
              <option value="" disabled selected>Select</option>
              <option value="single">Single</option>
              <option value="married">Married</option>
              <option value="divorced">Divorced</option>
              <option value="widowed">Widowed</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="18" min="18" max="120" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="(346) 123-4567" required>
        </div>

        <div class="form-group">
          <label for="address">Residential Address</label>
          <textarea id="address" rows="2" placeholder="Street, City, State" required></textarea>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="Create a password" required minlength="8">
            <button type="button" class="password-toggle" aria-label="Show password">&#128065;</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        <p class="auth-error" id="signup-error"></p>
      </form>

      <p class="auth-footer-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="Asset/java/script.js"></script>
</body>
</html>
